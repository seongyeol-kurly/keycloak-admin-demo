<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${appName}">어드민</title>
    <style th:inline="css">
        :root { --brand: [(${appColor})]; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
               background: #f4f5f7; color: #1f2328; }
        .card { width: min(480px, calc(100vw - 32px)); background: #fff; border-radius: 16px; padding: 36px 32px;
                box-shadow: 0 8px 30px rgba(0,0,0,.06); text-align: center; border-top: 6px solid var(--brand); }
        .app { font-size: 13px; color: var(--brand); font-weight: 700; letter-spacing: .02em; }
        h1 { font-size: 26px; margin: 8px 0 24px; }
        dl { display: grid; grid-template-columns: 90px 1fr; gap: 10px 12px; text-align: left; margin: 0 0 24px;
             background: #f6f8fa; padding: 16px 18px; border-radius: 10px; font-size: 14px; }
        dt { color: #656d76; } dd { margin: 0; word-break: break-all; }
        h2 { font-size: 14px; text-align: left; margin: 0 0 8px; color: #424a53; }
        .roles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .chip { padding: 5px 10px; border-radius: 999px; font-size: 13px; background: var(--brand); color: #fff; }
        .chip.muted { background: #eaeef2; color: #424a53; }
        .chip.missing { background: #fff8c5; color: #9a6700; border: 1px dashed #d4a72c; }
        .denied-sub { margin: -12px 0 20px; font-size: 14px; color: #656d76; line-height: 1.6; }
        .empty { font-size: 13px; color: #8b949e; }
        .actions { display: flex; gap: 8px; margin-top: 8px; }
        .actions form, .actions a { flex: 1; }
        button, .link { width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
                        display: block; text-decoration: none; }
        button { background: #fff; color: #cf222e; border: 1px solid #ffcecb; }
        .link { background: #f6f8fa; color: #1f2328; border: 1px solid #d0d7de; }
    </style>
</head>
<body>
<div class="card">
    <div class="app" th:text="${appName}">어드민</div>
    <h1 th:if="${!denied}">환영합니다, <span th:text="${name}">홍길동</span>님 👋</h1>
    <h1 th:if="${denied}"><span th:text="${name}">홍길동</span> 님, 권한 요청이 필요해요 🔒</h1>
    <p class="denied-sub" th:if="${denied}">이 어드민에 접근하려면 아래 권한이 필요해요.<br>관리자에게 권한을 요청한 뒤, 로그아웃 후 다시 로그인해주세요.</p>

    <dl>
        <dt>이름</dt><dd th:text="${name}">홍길동</dd>
        <dt>아이디</dt><dd th:text="${username}">hong</dd>
        <dt>이메일</dt><dd th:text="${email} ?: '-'">hong@example.com</dd>
    </dl>

    <th:block th:if="${denied}">
        <h2>필요한 권한</h2>
        <div class="roles">
            <span class="chip missing" th:each="r : ${missingRoles}" th:text="${r}">order.read</span>
        </div>
    </th:block>

    <h2>이 어드민 권한 (client role)</h2>
    <div class="roles">
        <span class="chip" th:each="r : ${clientRoles}" th:text="${r}">order.read</span>
        <span class="empty" th:if="${#lists.isEmpty(clientRoles)}">부여된 권한이 없어요</span>
    </div>

    <h2>공통 권한 (realm role)</h2>
    <div class="roles">
        <span class="chip muted" th:each="r : ${realmRoles}" th:text="${r}">member</span>
        <span class="empty" th:if="${#lists.isEmpty(realmRoles)}">없음</span>
    </div>

    <div class="actions">
        <a class="link" th:if="${!#strings.isEmpty(otherUrl)}" th:href="${otherUrl}" target="_blank"
           th:text="${otherName} + ' 열기 ↗'">다른 어드민</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">이 어드민만 로그아웃</button>
        </form>
    </div>
</div>
</body>
</html>
