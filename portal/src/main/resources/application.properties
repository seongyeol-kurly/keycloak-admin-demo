server.servlet.session.cookie.name=PORTAL_SESSION

# ---- 포털 자체 데이터 (소유자, 권한 신청, 감사 로그) ----
spring.datasource.url=jdbc:h2:file:${PORTAL_DATA_DIR:./data}/portal;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Keycloak ----
app.keycloak.public-url=${KC_PUBLIC_URL:https://15.165.81.59}
app.keycloak.internal-url=${KC_INTERNAL_URL:http://keycloak:8080}
app.keycloak.realm=${KC_REALM:demo}
# 포털 서비스 계정 (client_credentials) = Admin REST API 호출용. 사용자 로그인 client와 동일 client 사용
app.keycloak.admin-client-id=${CLIENT_ID:admin-portal}
app.keycloak.admin-client-secret=${CLIENT_SECRET}

# 시작 시 포털 관리 대상으로 가져올 기존 client (clientId:소유자username, 소유자 비우면 portal-admin만 관리)
app.seed-clients=${SEED_CLIENTS:order-admin:testuser,settle-admin:}
# 포털에서 절대 다룰 수 없는 client (Keycloak 내장 client 등)
app.protected-clients=realm-management,broker,account,account-console,admin-cli,security-admin-console,admin-portal

# 사용자 로그인 (OIDC)
spring.security.oauth2.client.registration.keycloak.client-id=${CLIENT_ID:admin-portal}
spring.security.oauth2.client.registration.keycloak.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.authorization-uri=${app.keycloak.public-url}/realms/${app.keycloak.realm}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${app.keycloak.internal-url}/realms/${app.keycloak.realm}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${app.keycloak.internal-url}/realms/${app.keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=${app.keycloak.internal-url}/realms/${app.keycloak.realm}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
