<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('client secret')}"></head>
<body>
<nav th:replace="~{fragments :: nav('clients')}"></nav>
<main>
    <h1 th:text="${title}">어드민이 등록됐어요</h1>
    <p class="sub">아래 secret은 <b>지금 한 번만</b> 보여줘요. 어드민 서버 설정에 바로 저장해주세요. (분실 시 재발급)</p>
    <div class="card">
        <table>
            <tr><th style="width:200px">어드민</th><td th:text="${client.name}"></td></tr>
            <tr><th>client ID</th><td><code th:text="${client.clientId}"></code></td></tr>
            <tr><th>client secret</th><td><code th:text="${secret}" style="font-size:15px"></code></td></tr>
            <tr><th>Redirect URI</th><td><code th:text="${client.baseUrl} + '/*'"></code></td></tr>
            <tr><th>Issuer</th><td><code>https://15.165.81.59/realms/demo</code></td></tr>
        </table>
    </div>
    <div class="card">
        <h2>Spring Boot 설정 예시</h2>
<pre style="background:#f6f8fa;padding:12px;border-radius:8px;overflow:auto" th:text="|spring.security.oauth2.client.registration.keycloak.client-id=${client.clientId}
spring.security.oauth2.client.registration.keycloak.client-secret=${secret}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=https://15.165.81.59/realms/demo|"></pre>
    </div>
    <a class="btn" th:href="@{/clients/{id}(id=${client.clientId})}">권한 관리로 이동 →</a>
</main>
</body>
</html>
