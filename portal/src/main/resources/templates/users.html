<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('임직원')}"></head>
<body>
<nav th:replace="~{fragments :: nav('users')}"></nav>
<main>
    <div th:replace="~{fragments :: flash}"></div>
    <h1>임직원</h1>
    <p class="sub">임직원을 검색해서 그룹과 어드민 권한을 확인·관리해요.</p>
    <div class="card">
        <form th:action="@{/users}" method="get" class="row" style="margin-bottom:12px">
            <input name="q" th:value="${q}" placeholder="이름, username, 이메일" style="width:260px">
            <button type="submit">검색</button>
        </form>
        <table>
            <tr><th>username</th><th>이름</th><th>이메일</th><th>상태</th></tr>
            <tr th:each="u : ${users}">
                <td><a th:href="@{/users/{id}(id=${u['id']})}" th:text="${u['username']}">testuser</a></td>
                <td th:text="${(u['firstName'] ?: '') + ' ' + (u['lastName'] ?: '')}"></td>
                <td th:text="${u['email']} ?: '-'"></td>
                <td><span class="chip green" th:if="${u['enabled']}">활성</span><span class="chip red" th:unless="${u['enabled']}">비활성</span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}"><td colspan="4" class="muted">검색 결과가 없어요.</td></tr>
        </table>
    </div>
</main>
</body>
</html>
